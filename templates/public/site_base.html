
{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Turfio{% endblock %} | Turfio</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
  <link href="{% static 'css/public_site.css' %}" rel="stylesheet">
</head>

<body class="public-site">

  <header class="site-header">
    <nav class="container site-nav">

      <a href="{% url 'dashboard' %}" class="site-brand">
        <span class="site-brand-icon">
          <i class="bi bi-grid-3x3-gap-fill"></i>
        </span>
        <span>Turfio</span>
      </a>

      <div class="site-nav-actions">
        <a
          href="{% url 'login_view' %}"
          class="site-login-link"
        >
          Log in
        </a>

        <a
          href="{% url 'signup' %}"
          class="site-btn site-btn-primary site-nav-signup"
        >
          Get Started
        </a>
      </div>

    </nav>
  </header>

  {% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <span>© {% now "Y" %} Turfio</span>

      <div class="site-footer-links">
        <a href="{% url 'dashboard' %}">Home</a>
        <a href="{% url 'marketplace' %}">Find a Turf</a>
        <a href="{% url 'owners_info' %}">For Owners</a>
      </div>
    </div>
  </footer>

</body>
</html>
