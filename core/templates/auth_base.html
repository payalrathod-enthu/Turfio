{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sign in{% endblock %} — Turfio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="auth-card">
      <div class="text-center mb-4">
        <h3 class="mb-0 fw-bold">Turfio</h3>
        <div class="text-muted small">Your Turf, Just the Way You Want It.</div>
      </div>
      {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
