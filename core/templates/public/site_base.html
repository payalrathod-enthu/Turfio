{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Turfio{% endblock %} — Turfio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="pub-nav">
    <div class="container d-flex align-items-center justify-content-between py-2">
      <a href="{% url 'dashboard' %}" class="text-white text-decoration-none fw-bold fs-5">Turfio</a>
      <div class="d-flex gap-3 small">
        <a class="text-white-50 text-decoration-none" href="{% url 'marketplace' %}">Find a Turf</a>
        <a class="text-white-50 text-decoration-none" href="{% url 'signup' %}">For Turf Owners</a>
        <a class="text-white text-decoration-none" href="{% url 'login_view' %}">Log in</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-muted small pb-4">Turfio — Your Turf, Just the Way You Want It.</footer>
</body>
</html>
