{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ biz.name }}{% endblock %} — {{ biz.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="pub-nav">
    <div class="container d-flex align-items-center gap-2 py-2" style="max-width: 760px;">
      {% if biz.logo %}<img src="{{ biz.logo.url }}" alt="" class="pub-logo">{% endif %}
      <a href="{% url 'public_home' biz.slug %}" class="text-white text-decoration-none fw-bold">{{ biz.name }}</a>
    </div>
  </nav>
  <main class="container py-4" style="max-width: 760px;">
    {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-muted small pb-4">Booking powered by Turfio</footer>
</body>
</html>
