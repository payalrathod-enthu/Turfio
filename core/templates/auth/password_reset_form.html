{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <p class="small text-muted">Enter your email and we'll send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Email" required autofocus></div>
    <button class="btn btn-success w-100">Send reset link</button>
  </form>
  <div class="small mt-3 text-center"><a href="{% url 'login_view' %}">Back to sign in</a></div>
{% endblock %}
