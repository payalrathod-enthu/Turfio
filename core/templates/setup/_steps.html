<div class="d-flex flex-wrap gap-2 mb-3">
  {% for s in steps %}
    <a href="{{ s.url }}" class="badge text-decoration-none px-3 py-2 {% if s.key == step %}bg-success{% elif s.done %}badge-status-green{% else %}badge-status-muted{% endif %}">
      {{ forloop.counter }}. {{ s.label }}{% if s.done and s.key != step %} ✓{% endif %}
    </a>
  {% endfor %}
</div>
{% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
