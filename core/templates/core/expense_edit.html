{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}
{% block content %}
  <h4 class="mb-3">Edit Expense</h4>
  <div class="tif-card p-3" style="max-width: 500px;">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-2"><label class="form-label small">{{ field.label }}</label>{{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
      {% endfor %}
      <button class="btn btn-success btn-sm w-100">Save Changes</button>
    </form>
  </div>
{% endblock %}
